name: CD

on:
  push:
    branches: [develop, main]

permissions:
  id-token: write   # required for AWS OIDC — no long-lived AWS keys stored in GitHub
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  # develop -> staging, main -> production. The environment name here also
  # has to match the "environment:staging" / "environment:production" sub
  # claims the OIDC trust policy checks — see
  # infrastructure/terraform/modules/security.
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
    steps:
      - id: set
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env_name }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev

      - name: Package revision
        run: zip -r "../backend-${{ github.sha }}.zip" . -x '*.env*'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Upload revision to S3
        working-directory: .
        run: aws s3 cp "backend-${{ github.sha }}.zip" "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/backend/${{ github.sha }}.zip"

      - name: Trigger CodeDeploy and wait for completion
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "silas-mobiles-${{ needs.determine-environment.outputs.env_name }}" \
            --deployment-group-name "silas-mobiles-${{ needs.determine-environment.outputs.env_name }}-dg" \
            --s3-location "bucket=${{ vars.DEPLOY_ARTIFACTS_BUCKET }},key=backend/${{ github.sha }}.zip,bundleType=zip" \
            --query 'deploymentId' --output text)
          echo "CodeDeploy deployment: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"

  deploy-frontend:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env_name }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Sync build to S3
        run: aws s3 sync dist/ "s3://${{ vars.STATIC_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
