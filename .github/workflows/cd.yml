name: CD

on:
  push:
    branches: [develop, main]

permissions:
  id-token: write   # required for AWS OIDC — no long-lived AWS keys stored in GitHub
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  # develop -> staging, main -> production. The environment name here also
  # has to match the "environment:staging" / "environment:production" sub
  # claims the OIDC trust policy checks — see
  # infrastructure/terraform/modules/security.
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
    steps:
      - id: set
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

  # Builds the backend revision once and uploads it to S3. Both
  # migrate-database and deploy-backend use this same zip — the migration
  # step needs full source (it npm-installs and runs sequelize-cli from
  # it), not just the migrations folder, so there is no smaller artifact
  # worth building separately.
  package-backend:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env_name }}
    outputs:
      artifact_key: backend/${{ github.sha }}.zip
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev

      - name: Package revision
        run: zip -r "../backend-${{ github.sha }}.zip" . -x '*.env*'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Upload revision to S3
        working-directory: .
        run: aws s3 cp "backend-${{ github.sha }}.zip" "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/backend/${{ github.sha }}.zip"

  # Runs `npm run db:migrate` on one running instance via SSM, before any
  # new application code ships — schema changes land first, so code that
  # depends on them never starts against a database that doesn't have
  # them yet. Self-contained: downloads and installs the just-uploaded
  # revision to a scratch directory on the instance rather than assuming
  # /opt/silas-backend/current already holds a previous deployment, which
  # is what makes this safe to run on a completely fresh environment's
  # very first deploy, not just the second one onward.
  #
  # SSM, not a direct DB connection from the runner: RDS sits in a private
  # subnet with no route from a public GitHub-hosted runner (see
  # infrastructure/terraform/modules/networking) — an instance already
  # inside the VPC has to run this on the runner's behalf.
  migrate-database:
    needs: [determine-environment, package-backend]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env_name }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Find a running instance in the target Auto Scaling Group
        id: instance
        run: |
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "silas-mobiles-${{ needs.determine-environment.outputs.env_name }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId | [0]' \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No InService instance in the ASG — infrastructure not up yet? Run terraform apply first."
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Run migrations via SSM
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
          KEY: ${{ needs.package-backend.outputs.artifact_key }}
        run: |
          COMMANDS=$(cat <<SCRIPT | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().splitlines()))'
          set -eu
          rm -rf /tmp/migrate-scratch && mkdir -p /tmp/migrate-scratch
          cd /tmp/migrate-scratch
          aws s3 cp "s3://${BUCKET}/${KEY}" revision.zip
          unzip -q revision.zip
          npm ci --omit=dev
          npm run db:migrate
          cd / && rm -rf /tmp/migrate-scratch
          SCRIPT
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": ${COMMANDS}}" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Fail the job if the migration command itself failed
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          STATUS=$(aws ssm list-command-invocations --instance-id "$INSTANCE_ID" --details --max-results 1 --query 'CommandInvocations[0].Status' --output text)
          echo "Migration command status: $STATUS"
          [ "$STATUS" = "Success" ]

  deploy-backend:
    needs: [determine-environment, package-backend, migrate-database]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env_name }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Trigger CodeDeploy and wait for completion
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
          KEY: ${{ needs.package-backend.outputs.artifact_key }}
          ENV_NAME: ${{ needs.determine-environment.outputs.env_name }}
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "silas-mobiles-${ENV_NAME}" \
            --deployment-group-name "silas-mobiles-${ENV_NAME}-dg" \
            --s3-location "bucket=${BUCKET},key=${KEY},bundleType=zip" \
            --query 'deploymentId' --output text)
          echo "CodeDeploy deployment: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"

  deploy-frontend:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.env_name }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1

      - name: Sync build to S3
        run: aws s3 sync dist/ "s3://${{ vars.STATIC_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
