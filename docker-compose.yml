# Local development only (matches the "Development" row of the Environments
# table in Section 9.1.10: "Developer machines, Docker Compose"). Staging
# and production run on real AWS infrastructure via Terraform + CodeDeploy —
# see infrastructure/terraform/README.md.
#
# Usage:
#   cp backend/.env.example backend/.env
#   docker compose up --build          # migrates automatically, then starts the API
#   docker compose run --rm migrate npm run db:seed   # optional demo data
#   cd frontend && cp .env.example .env.local && npm install && npm run dev

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: silas_mobiles
      POSTGRES_USER: silas_app
      POSTGRES_PASSWORD: silas_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silas_app -d silas_mobiles']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs migrations and exits. The backend service below waits
  # for it to *finish successfully* (not just for postgres to be up)
  # before starting, so `docker compose up` always starts against an
  # up-to-date schema without a manual migrate step.
  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    command: npm run db:migrate

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests

volumes:
  postgres-data:
